{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
{% load static %}

<div class="w-full min-h-screen
            bg-[url('{% static "img/Login-Background-light.jpg" %}')]
            dark:bg-[url('{% static "img/Login-Background-dark.jpg" %}')]
            bg-cover bg-center bg-no-repeat
            bg-white/40 dark:bg-black/50 bg-blend-overlay
            flex items-center justify-center px-4 py-20">

  <!-- REGISTER CARD -->
  <div class="relative z-10 w-full max-w-md
              bg-white/60 dark:bg-slate-900/60
              backdrop-blur-md
              p-10 rounded-2xl shadow-[0_0_35px_rgba(0,0,0,0.8)]
              dark:shadow-[0_0_25px_rgba(255,255,255,0.6)]
              transition-all duration-500
              hover:scale-[1.02] hover:shadow-2xl">

    <h2 class="text-3xl font-extrabold text-accent text-center mb-10">
      Register
    </h2>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Username -->
      <input type="text" name="username" placeholder="Username" required
             value="{{ username|default:'' }}"
             class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                    bg-white dark:bg-gray-800 text-text dark:text-darktext
                    focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">

      <!-- Email -->
      <input type="email" name="email" placeholder="Email" required
             value="{{ email|default:'' }}"
             class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                    bg-white dark:bg-gray-800 text-text dark:text-darktext
                    focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">

      <!-- Phone -->
      <input type="tel" name="phone" placeholder="Phone Number" required
             value="{{ phone|default:'' }}"
             class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                    bg-white dark:bg-gray-800 text-text dark:text-darktext
                    focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">

      <!-- Password -->
      <div class="relative">
        <input type="password" id="password1" name="password" placeholder="Password" required
               class="w-full px-4 py-2 pr-12 border border-border dark:border-darkborder rounded-lg
                      bg-white dark:bg-gray-800 text-text dark:text-darktext
                      focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">
        <!-- Toggle Password Icon -->
        <button type="button" onclick="togglePassword('password1', 'eye1')" 
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-300 hover:text-accent">
          <svg id="eye1" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" 
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                     -1.274 4.057-5.064 7-9.542 7 -4.477 0 -8.268 -2.943 -9.542 -7z"/>
          </svg>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <input type="password" id="password2" name="confirm_password" placeholder="Confirm Password" required
               class="w-full px-4 py-2 pr-12 border border-border dark:border-darkborder rounded-lg
                      bg-white dark:bg-gray-800 text-text dark:text-darktext
                      focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">
        <!-- Toggle Password Icon -->
        <button type="button" onclick="togglePassword('password2', 'eye2')" 
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-300 hover:text-accent">
          <svg id="eye2" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" 
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                     -1.274 4.057-5.064 7-9.542 7 -4.477 0 -8.268 -2.943 -9.542 -7z"/>
          </svg>
        </button>
      </div>

      <!-- Firstname / Lastname -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="first_name" placeholder="First Name" required
               value="{{ first_name|default:'' }}"
               class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                      bg-white dark:bg-gray-800 text-text dark:text-darktext
                      focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">

        <input type="text" name="last_name" placeholder="Last Name" required
               value="{{ last_name|default:'' }}"
               class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                      bg-white dark:bg-gray-800 text-text dark:text-darktext
                      focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">
      </div>

      <!-- Country / City -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="country" placeholder="Country" required
               value="{{ country|default:'' }}"
               class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                      bg-white dark:bg-gray-800 text-text dark:text-darktext
                      focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">

        <input type="text" name="city" placeholder="City / Province" required
               value="{{ city|default:'' }}"
               class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg
                      bg-white dark:bg-gray-800 text-text dark:text-darktext
                      focus:outline-none focus:ring-2 focus:ring-accent transition-colors duration-300">
      </div>

      <button type="submit"
              class="w-full bg-accent text-white py-2 rounded-lg
                     hover:bg-accent/90 transition-colors duration-300 font-semibold">
        Register
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 dark:text-gray-300 mt-4">
      Already have an account?
      <a href="{% url 'login' %}" class="text-accent font-semibold hover:underline">Login</a>
    </p>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="fixed bottom-5 right-5 flex flex-col-reverse space-y-2 z-50"></div>

<script>
function togglePassword(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);

  if (input.type === "password") {
    input.type = "text";
    icon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19
               c-4.478 0-8.268-2.943-9.542-7
               a9.965 9.965 0 011.563-3.029m3.2-2.328
               A9.953 9.953 0 0112 5c4.478 0 8.268 2.943
               9.542 7-1.274 4.057-5.064 7-9.542 7z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3l18 18"/>
    `;
  } else {
    input.type = "password";
    icon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5
               c4.478 0 8.268 2.943 9.542 7
               -1.274 4.057-5.064 7-9.542 7
               -4.477 0-8.268-2.943-9.542-7z"/>
    `;
  }
}

</script>

{% endblock %}

{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
{% load static %}

<div class="
    w-full min-h-screen
    bg-[url('{% static "img/Background-Library-light.jpg" %}')]
    dark:bg-[url('{% static "img/Background-Library-dark.jpg" %}')]
    bg-cover bg-center bg-no-repeat
    flex flex-col items-center justify-center px-4
">

    <!-- TITLE -->
    <div class="text-center mb-12">
      <h1
        style="-webkit-text-stroke: 2px #00336e; -webkit-text-fill-color: transparent;"
        class="
        text-5xl md:text-6xl font-extrabold 
        bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 
        bg-clip-text text-transparent
        tracking-widest drop-shadow-xl
        "
        >
        HOME
        </h1>


      <p class="
          mt-2 text-lg md:text-xl 
          text-gray-700 dark:text-white
          tracking-[0.25em] uppercase
          light-stroke dark-glow
      ">
        menu
      </p>
    </div>

    <!-- MENU BUTTONS -->
    <div class="flex flex-col gap-4 w-full max-w-xs">

      <!-- Marketplace -->
        <a href="{% url 'marketplace' %}"
          class="relative inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full
                border-[3px] border-emerald-500 text-emerald-600 font-bold tracking-wide
                bg-white/70 dark:bg-slate-900/70 btn-glow
                hover:bg-emerald-500 hover:text-white
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-200 ease-out">

          <!-- Filled Shopping Cart Icon -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="currentColor"
     class="w-5 h-5">
  <path d="M2 3h2.2c.45 0 .84.3.96.74L5.6 6h13.9c.7 0 1.18.68.96 1.35l-2.3 7
           c-.2.6-.76 1-1.4 1H8.1l-.5 1.7c-.13.45.2.9.67.9h11.73v1.5H8.2
           c-1.5 0-2.6-1.45-2.15-2.88L7.1 15 4.6 5H2V3z"/>
  <circle cx="9" cy="20" r="1.5"/>
  <circle cx="17" cy="20" r="1.5"/>
</svg>


          Marketplace
        </a>


      <!-- Posts -->
      <a href="{% url 'posts' %}"
        class="relative inline-flex items-center justify-center px-6 py-3 rounded-full
                border-[3px] border-sky-500 text-sky-600 font-bold tracking-wide
                bg-white/70 dark:bg-slate-900/70 btn-glow
                hover:bg-sky-500 hover:text-white
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-200 ease-out">
        Posts
      </a>

      <!-- Missing Pet -->
      <a href="{% url 'posts' %}?tag=missing"
        class="relative inline-flex items-center justify-center px-6 py-3 rounded-full
                border-[3px] border-rose-500 text-rose-600 font-bold tracking-wide
                bg-white/70 dark:bg-slate-900/70 btn-glow
                hover:bg-rose-500 hover:text-white
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-200 ease-out">
        Missing Pet
      </a>

      <!-- Found Pet -->
      <a href="{% url 'posts' %}?tag=found"
        class="relative inline-flex items-center justify-center px-6 py-3 rounded-full
                border-[3px] border-amber-400 text-amber-600 font-bold tracking-wide
                bg-white/70 dark:bg-slate-900/70 btn-glow
                hover:bg-amber-400 hover:text-black
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-200 ease-out">
        Found Pet
      </a>

      <!-- Adopt -->
      <a href="{% url 'marketplace' %}?type=PET"
        class="relative inline-flex items-center justify-center px-6 py-3 rounded-full
                border-[3px] border-purple-500 text-purple-600 font-bold tracking-wide
                bg-white/70 dark:bg-slate-900/70 btn-glow
                hover:bg-purple-500 hover:text-white
                hover:shadow-xl hover:-translate-y-1
                transition-all duration-200 ease-out">
        Adopt a Pet
      </a>

    </div>

  </div>

</div>

{% endblock %}

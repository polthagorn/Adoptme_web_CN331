{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
{% load static %}

<!-- 🌟 FULLSCREEN BACKGROUND WITH LIGHT/DARK IMAGE -->
<div class="
  w-full min-h-screen
  bg-[url('{% static "img/Login-Background-light.jpg" %}')]
  dark:bg-[url('{% static "img/Login-Background-dark.jpg" %}')]
  bg-cover bg-center bg-no-repeat
  flex items-center justify-center
  px-4
">

  <!-- ✨ REGISTER BOX ✨ -->
  <div class="relative z-10 max-w-md w-full mx-auto 
              bg-surface dark:bg-darksurface 
              bg-opacity-90 dark:bg-opacity-95
              p-8 rounded-2xl 
              shadow-[0_0_35px_rgba(0,0,0,0.8)]
              dark:shadow-[0_0_25px_rgba(255,255,255,0.6)]
              transition-all duration-500">

    <h2 class="text-3xl font-bold text-accent text-center mb-6">Register</h2>

    <!-- 🔥 ERROR & SUCCESS MESSAGES -->
    {% if messages %}
      <div class="space-y-2 mb-4">
        {% for message in messages %}
          <div
            class="
              px-4 py-3 rounded-lg text-sm font-medium
              {% if message.tags == 'error' %}
                bg-red-100 text-red-700 border border-red-300 dark:bg-red-900 dark:text-red-200 dark:border-red-700
              {% elif message.tags == 'success' %}
                bg-green-100 text-green-700 border border-green-300 dark:bg-green-900 dark:text-green-200 dark:border-green-700
              {% else %}
                bg-blue-100 text-blue-700 border border-blue-300 dark:bg-blue-900 dark:text-blue-200 dark:border-blue-700
              {% endif %}
            "
          >
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <!-- END Messages -->

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Username -->
      <input type="text" name="username" placeholder="Username" required
        value="{{ username }}"
        class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
               bg-white dark:bg-gray-800
               text-text dark:text-darktext 
               focus:outline-none focus:ring-2 focus:ring-accent 
               transition-colors duration-300">

      <!-- Email -->
      <input type="email" name="email" placeholder="Email" required
        value="{{ email }}"
        class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
               bg-white dark:bg-gray-800
               text-text dark:text-darktext 
               focus:outline-none focus:ring-2 focus:ring-accent 
               transition-colors duration-300">

      <!-- Phone -->
      <input type="tel" name="phone" placeholder="Phone Number" required
        value="{{ phone }}"
        class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
               bg-white dark:bg-gray-800
               text-text dark:text-darktext 
               focus:outline-none focus:ring-2 focus:ring-accent 
               transition-colors duration-300">

      <!-- Password + reveal -->
      <div class="relative">
        <input type="password" id="password1" name="password" placeholder="Password" required
          class="w-full px-4 py-2 pr-16 border border-border dark:border-darkborder rounded-lg 
                 bg-white dark:bg-gray-800
                 text-text dark:text-darktext 
                 focus:outline-none focus:ring-2 focus:ring-accent 
                 transition-colors duration-300">
        <button
          type="button"
          onclick="toggleSinglePassword('password1', 'toggle-btn-1')"
          id="toggle-btn-1"
          class="absolute inset-y-0 right-3 my-auto text-xs font-semibold 
                 text-gray-500 dark:text-gray-300 hover:text-accent"
        >
          Show
        </button>
      </div>

      <!-- Confirm Password + reveal -->
      <div class="relative">
        <input type="password" id="password2" name="confirm_password" placeholder="Confirm Password" required
          class="w-full px-4 py-2 pr-16 border border-border dark:border-darkborder rounded-lg 
                 bg-white dark:bg-gray-800
                 text-text dark:text-darktext 
                 focus:outline-none focus:ring-2 focus:ring-accent 
                 transition-colors duration-300">
        <button
          type="button"
          onclick="toggleSinglePassword('password2', 'toggle-btn-2')"
          id="toggle-btn-2"
          class="absolute inset-y-0 right-3 my-auto text-xs font-semibold 
                 text-gray-500 dark:text-gray-300 hover:text-accent"
        >
          Show
        </button>
      </div>

      <!-- Firstname / Lastname in one row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="first_name" placeholder="First Name" required
          value="{{ first_name }}"
          class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
                 bg-white dark:bg-gray-800
                 text-text dark:text-darktext 
                 focus:outline-none focus:ring-2 focus:ring-accent 
                 transition-colors duration-300">

        <input type="text" name="last_name" placeholder="Last Name" required
          value="{{ last_name }}"
          class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
                 bg-white dark:bg-gray-800
                 text-text dark:text-darktext 
                 focus:outline-none focus:ring-2 focus:ring-accent 
                 transition-colors duration-300">
      </div>

      <!-- Country / City in one row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="country" placeholder="Country" required
          value="{{ country }}"
          class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
                 bg-white dark:bg-gray-800
                 text-text dark:text-darktext 
                 focus:outline-none focus:ring-2 focus:ring-accent 
                 transition-colors duration-300">

        <input type="text" name="city" placeholder="City / Province" required
          value="{{ city }}"
          class="w-full px-4 py-2 border border-border dark:border-darkborder rounded-lg 
                 bg-white dark:bg-gray-800
                 text-text dark:text-darktext 
                 focus:outline-none focus:ring-2 focus:ring-accent 
                 transition-colors duration-300">
      </div>

      <button type="submit" 
        class="w-full bg-accent text-white py-2 rounded-lg 
               hover:bg-accent/90 transition-colors duration-300 
               font-semibold">
        Register
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="text-sm text-gray-600 dark:text-gray-300">
        Already have an account?
        <a href="{% url 'login' %}" class="text-accent font-semibold hover:underline">
          Login
        </a>
      </p>
    </div>

  </div> <!-- end register panel -->

</div> <!-- end background -->

<script>
function toggleSinglePassword(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);

  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Hide";
  } else {
    input.type = "password";
    btn.textContent = "Show";
  }
}
</script>

{% endblock %}
